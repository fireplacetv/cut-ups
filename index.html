<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cut-Up Text Generator</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <div>
        <h1>Cut-Up Text Generator</h1>
        <p class="tagline">Apply Burroughs & Gysin techniques to your text</p>
      </div>
      <button id="helpToggle" class="help-btn" aria-label="Toggle help panel">
        <span>?</span>
        <span class="help-label">Help</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="controls-panel">
      <div class="control-section">
        <label>Technique:</label>
        <div class="method-buttons">
          <button class="btn btn-method" type="button" data-method="quadrant" aria-label="Quadrant: wraps text into a 2D grid and shuffles the 4 quadrants">
            <svg viewBox="0 0 16 16" class="method-icon"><rect x="1" y="1" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="1" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="9" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            Quadrant
          </button>
          <button class="btn btn-method" type="button" data-method="fold-in" aria-label="Fold-In: splits text by lines and interleaves them together">
            <svg viewBox="0 0 16 16" class="method-icon"><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="5" x2="6" y2="5" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="5" x2="14" y2="5" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="8" x2="6" y2="8" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="11" x2="6" y2="11" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="1.5"/></svg>
            Fold-In
          </button>
          <button class="btn btn-method" type="button" data-method="line-shuffle" aria-label="Line Shuffle: cuts text into lines and randomly shuffles them">
            <svg viewBox="0 0 16 16" class="method-icon"><line x1="2" y1="3" x2="14" y2="3" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
            Lines
          </button>
          <button class="btn btn-method" type="button" data-method="sentence-shuffle" aria-label="Sentence Shuffle: cuts text into sentences and randomly shuffles them">
            <svg viewBox="0 0 16 16" class="method-icon"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="10" x2="14" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="13" x2="10" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
            Sentences
          </button>
          <button class="btn btn-method" type="button" data-method="word-scramble" aria-label="Word Scramble: cuts text into words and randomly shuffles them">
            <svg viewBox="0 0 16 16" class="method-icon"><text x="2" y="6" font-size="4" font-weight="bold" fill="currentColor">A</text><text x="7" y="10" font-size="4" font-weight="bold" fill="currentColor">B</text><text x="12" y="5" font-size="4" font-weight="bold" fill="currentColor">C</text><text x="3" y="13" font-size="4" font-weight="bold" fill="currentColor">D</text><text x="10" y="12" font-size="4" font-weight="bold" fill="currentColor">E</text></svg>
            Words
          </button>
        </div>
      </div>

      <div class="control-section">
        <label for="widthSlider">Line width: <span id="widthValue">80</span>ch</label>
        <input type="range" id="widthSlider" min="40" max="120" value="80" step="1" class="width-slider" data-default="80">
        <button id="wrapButton" class="btn btn-secondary" type="button">Wrap Text</button>
        <button id="cleanWhitespaceButton" class="btn btn-secondary" type="button">Clean Whitespace</button>
      </div>
    </div>

    <div class="input-panel panel">
      <label for="input">Your text:</label>
      <textarea id="input" placeholder="Paste your source text here..."></textarea>
    </div>
  </main>


  <script type="module">
    import { initializeUI } from './src/ui.js';
    document.addEventListener('DOMContentLoaded', initializeUI);
  </script>
</body>
</html>
