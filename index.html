<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cut-Up Text Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cut-Up Text Generator</h1>

  <div class="container">
    <div class="panel">
      <label for="input">Paste your text:</label>
      <textarea id="input" placeholder="Enter or paste text here..."></textarea>
    </div>

    <div class="panel">
      <label for="output">Cut-up result:</label>
      <div id="output"></div>
    </div>
  </div>

  <div class="controls">
    <div>
      <label for="method">Method:</label>
      <select id="method">
        <option value="quadrant">Quadrant Cut</option>
        <option value="fold-in">Fold-In</option>
        <option value="line-shuffle">Line Shuffle</option>
        <option value="sentence-shuffle">Sentence Shuffle</option>
        <option value="word-scramble">Word Scramble</option>
      </select>
    </div>

    <div id="segmentControl" style="display: none;">
      <label for="segmentCount">Cut Size:</label>
      <input type="number" id="segmentCount" min="2" max="20" value="4">
    </div>

    <div class="button-row">
      <button id="cutBtn">Cut Up Input</button>
      <button id="cutOutputBtn">Cut Up Output</button>
      <button id="copyBtn">Copy Result</button>
    </div>
  </div>

  <script>
    function tokenize(text, unit, segmentCount = 4) {
      if (!text || !text.trim()) {
        return [];
      }

      switch (unit) {
        case 'word':
          return text.split(/\s+/).filter(w => w.length > 0);

        case 'line':
          return text.split('\n');

        case 'sentence': {
          const sentences = [];
          let current = '';
          for (let i = 0; i < text.length; i++) {
            current += text[i];
            if ((text[i] === '.' || text[i] === '!' || text[i] === '?') &&
                (i === text.length - 1 || /\s/.test(text[i + 1]))) {
              sentences.push(current.trim());
              current = '';
            }
          }
          if (current.trim()) {
            sentences.push(current.trim());
          }
          return sentences.filter(s => s.length > 0);
        }

        case 'segment': {
          if (segmentCount < 2) return [text];
          const chunkSize = Math.ceil(text.length / segmentCount);
          const segments = [];
          for (let i = 0; i < text.length; i += chunkSize) {
            segments.push(text.slice(i, i + chunkSize));
          }
          return segments;
        }

        default:
          return [text];
      }
    }

    function shuffle(chunks) {
      const arr = [...chunks];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function foldIn(chunks) {
      if (chunks.length < 2) return chunks;

      const mid = Math.floor(chunks.length / 2);
      const first = chunks.slice(0, mid);
      const second = chunks.slice(mid);

      const result = [];
      const maxLen = Math.max(first.length, second.length);

      for (let i = 0; i < maxLen; i++) {
        if (i < first.length) result.push(first[i]);
        if (i < second.length) result.push(second[i]);
      }

      return result;
    }

    function join(chunks, unit) {
      if (chunks.length === 0) return '';

      switch (unit) {
        case 'word':
          return chunks.join(' ');
        case 'line':
          return chunks.join('\n');
        case 'sentence':
          return chunks.join(' ');
        case 'segment':
          return chunks.join('');
        default:
          return chunks.join('');
      }
    }

    function cutUp(text, method, options = {}) {
      const { segmentCount = 4 } = options;

      if (!text || !text.trim()) {
        return text;
      }

      let unit;
      switch (method) {
        case 'quadrant':
          unit = 'segment';
          break;
        case 'fold-in':
          unit = 'line';
          break;
        case 'line-shuffle':
          unit = 'line';
          break;
        case 'sentence-shuffle':
          unit = 'sentence';
          break;
        case 'word-scramble':
          unit = 'word';
          break;
        default:
          return text;
      }

      let chunks = unit === 'segment'
        ? tokenize(text, unit, segmentCount)
        : tokenize(text, unit);

      if (chunks.length < 2) {
        return text;
      }

      let result;
      switch (method) {
        case 'quadrant':
          result = shuffle(chunks);
          break;
        case 'fold-in':
          result = foldIn(chunks);
          break;
        case 'line-shuffle':
        case 'sentence-shuffle':
        case 'word-scramble':
          result = shuffle(chunks);
          break;
        default:
          result = chunks;
      }

      return join(result, unit);
    }

    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const methodEl = document.getElementById('method');
    const segmentCountEl = document.getElementById('segmentCount');
    const segmentControl = document.getElementById('segmentControl');
    const cutBtn = document.getElementById('cutBtn');
    const cutOutputBtn = document.getElementById('cutOutputBtn');
    const copyBtn = document.getElementById('copyBtn');

    function toggleSegmentControl() {
      segmentControl.style.display = methodEl.value === 'quadrant' ? 'block' : 'none';
    }

    function performCutUp() {
      const text = inputEl.value;
      const method = methodEl.value;
      const segmentCount = parseInt(segmentCountEl.value) || 4;

      const result = cutUp(text, method, { segmentCount });
      outputEl.textContent = result;
    }

    methodEl.addEventListener('change', () => {
      toggleSegmentControl();
    });

    cutBtn.addEventListener('click', performCutUp);

    cutOutputBtn.addEventListener('click', () => {
      const text = outputEl.textContent;
      if (!text) {
        alert('No output to cut up. Generate a cut-up first.');
        return;
      }
      const method = methodEl.value;
      const segmentCount = parseInt(segmentCountEl.value) || 4;

      const result = cutUp(text, method, { segmentCount });
      outputEl.textContent = result;
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(outputEl.textContent);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 2000);
      } catch (err) {
        console.error('Failed to copy:', err);
        copyBtn.textContent = 'Copy failed';
        setTimeout(() => {
          copyBtn.textContent = 'Copy Result';
        }, 2000);
      }
    });

    toggleSegmentControl();
  </script>
</body>
</html>
