<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cut-Up Text Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <div>
        <h1>Cut-Up Text Generator</h1>
        <p class="tagline">Apply Burroughs & Gysin techniques to your text</p>
      </div>
      <button id="helpToggle" class="help-btn" aria-label="Toggle help panel">
        <span>?</span>
        <span class="help-label">Help</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="input-panel panel">
      <label for="input">Your text:</label>
      <textarea id="input" placeholder="Paste your source text here..."></textarea>
    </div>

    <div class="controls-panel">
      <div class="control-section">
        <label>Technique:</label>
        <div class="method-buttons">
          <button class="btn btn-method" data-method="quadrant" title="Wraps text into a 2D grid and shuffles the 4 quadrants">Quadrant</button>
          <button class="btn btn-method" data-method="fold-in" title="Splits text by lines and interleaves them together">Fold-In</button>
          <button class="btn btn-method" data-method="line-shuffle" title="Cuts text into lines and randomly shuffles them">Lines</button>
          <button class="btn btn-method" data-method="sentence-shuffle" title="Cuts text into sentences and randomly shuffles them">Sentences</button>
          <button class="btn btn-method" data-method="word-scramble" title="Cuts text into words and randomly shuffles them">Words</button>
        </div>
      </div>

      <div class="control-section">
        <label for="widthSlider">Line width: <span id="widthValue">80</span>ch</label>
        <input type="range" id="widthSlider" min="40" max="120" value="80" step="1" class="width-slider">
      </div>

      <div class="control-section">
        <button id="useResultBtn" class="btn btn-secondary">Use Result</button>
        <a href="help.html" class="btn btn-help-link">Help</a>
      </div>
    </div>

    <div class="output-panel panel">
      <label for="output">Cut-up result:</label>
      <div id="output" class="output-area"></div>
    </div>
  </main>


  <script>
    function tokenize(text, unit, pageWidth = 80) {
      if (!text || !text.trim()) {
        return [];
      }

      switch (unit) {
        case 'word':
          return text.split(/\s+/).filter(w => w.length > 0);

        case 'line':
          return text.split('\n');

        case 'sentence': {
          const sentences = [];
          let current = '';
          for (let i = 0; i < text.length; i++) {
            current += text[i];
            if ((text[i] === '.' || text[i] === '!' || text[i] === '?') &&
                (i === text.length - 1 || /\s/.test(text[i + 1]))) {
              sentences.push(current.trim());
              current = '';
            }
          }
          if (current.trim()) {
            sentences.push(current.trim());
          }
          return sentences.filter(s => s.length > 0);
        }

        case 'quadrant2d': {
          const lines = text.split('\n');
          return { lines, pageWidth };
        }

        default:
          return [text];
      }
    }

    function quadrantCut2D(textData) {
      const { lines, pageWidth } = textData;
      if (lines.length < 2) return lines;

      const midRow = Math.floor(lines.length / 2);
      const topLines = lines.slice(0, midRow);
      const bottomLines = lines.slice(midRow);

      const topLeft = [];
      const topRight = [];
      const bottomLeft = [];
      const bottomRight = [];

      const midCol = Math.floor(pageWidth / 2);

      for (const line of topLines) {
        topLeft.push(line.slice(0, midCol));
        topRight.push(line.slice(midCol));
      }

      for (const line of bottomLines) {
        bottomLeft.push(line.slice(0, midCol));
        bottomRight.push(line.slice(midCol));
      }

      const quadrants = [topLeft, topRight, bottomLeft, bottomRight];
      const shuffled = shuffle(quadrants);

      const result = [];
      const maxLines = Math.max(...shuffled.map(q => q.length));

      for (let i = 0; i < maxLines; i++) {
        let row = '';
        row += (shuffled[0][i] || '').padEnd(midCol);
        row += (shuffled[1][i] || '').padEnd(midCol);
        result.push(row);
      }

      for (let i = 0; i < maxLines; i++) {
        let row = '';
        row += (shuffled[2][i] || '').padEnd(midCol);
        row += (shuffled[3][i] || '').padEnd(midCol);
        result.push(row);
      }

      return result.join('\n');
    }

    function shuffle(chunks) {
      const arr = [...chunks];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function foldIn(chunks) {
      if (chunks.length < 2) return chunks;

      const mid = Math.floor(chunks.length / 2);
      const first = chunks.slice(0, mid);
      const second = chunks.slice(mid);

      const result = [];
      const maxLen = Math.max(first.length, second.length);

      for (let i = 0; i < maxLen; i++) {
        if (i < first.length) result.push(first[i]);
        if (i < second.length) result.push(second[i]);
      }

      return result;
    }

    function join(chunks, unit) {
      if (chunks.length === 0) return '';

      switch (unit) {
        case 'word':
          return chunks.join(' ');
        case 'line':
          return chunks.join('\n');
        case 'sentence':
          return chunks.join(' ');
        case 'segment':
          return chunks.join('');
        default:
          return chunks.join('');
      }
    }

    function smartWrap(text, width) {
      if (!text || width <= 0) return text;

      const lines = text.split('\n');
      return lines.map(line => {
        if (line.length <= width) return line;

        const words = line.split(' ');
        const wrappedLines = [];
        let currentLine = '';

        for (const word of words) {
          if (currentLine.length === 0) {
            currentLine = word;
          } else if ((currentLine + ' ' + word).length <= width) {
            currentLine += ' ' + word;
          } else {
            if (currentLine) wrappedLines.push(currentLine);
            currentLine = word;
          }
        }

        if (currentLine) wrappedLines.push(currentLine);
        return wrappedLines.join('\n');
      }).join('\n');
    }

    function cutUp(text, method, options = {}) {
      const { pageWidth = 80 } = options;

      if (!text || !text.trim()) {
        return text;
      }

      if (method === 'quadrant') {
        const textData = tokenize(text, 'quadrant2d', pageWidth);
        return quadrantCut2D(textData);
      }

      let unit;
      switch (method) {
        case 'fold-in':
          unit = 'line';
          break;
        case 'line-shuffle':
          unit = 'line';
          break;
        case 'sentence-shuffle':
          unit = 'sentence';
          break;
        case 'word-scramble':
          unit = 'word';
          break;
        default:
          return text;
      }

      let chunks = tokenize(text, unit);

      if (chunks.length < 2) {
        return text;
      }

      let result;
      switch (method) {
        case 'fold-in':
          result = foldIn(chunks);
          break;
        case 'line-shuffle':
        case 'sentence-shuffle':
        case 'word-scramble':
          result = shuffle(chunks);
          break;
        default:
          result = chunks;
      }

      return join(result, unit);
    }

    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const methodButtons = document.querySelectorAll('.btn-method');
    const widthSlider = document.getElementById('widthSlider');
    const widthValue = document.getElementById('widthValue');
    const useResultBtn = document.getElementById('useResultBtn');

    let selectedMethod = 'quadrant';
    let selectedWidth = 80;

    function performCutUp() {
      const text = inputEl.value;
      if (!text.trim()) {
        return;
      }

      const result = cutUp(text, selectedMethod, { pageWidth: selectedWidth });
      const wrapped = smartWrap(result, selectedWidth);
      outputEl.textContent = wrapped;
    }

    methodButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        selectedMethod = btn.dataset.method;
        performCutUp();
      });
    });

    widthSlider.addEventListener('input', () => {
      selectedWidth = parseInt(widthSlider.value);
      widthValue.textContent = selectedWidth;
      performCutUp();
    });

    useResultBtn.addEventListener('click', () => {
      const text = outputEl.textContent;
      if (!text) {
        return;
      }
      inputEl.value = text;
    });
  </script>
</body>
</html>
