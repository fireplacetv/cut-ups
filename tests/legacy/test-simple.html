<!DOCTYPE html>
<html>
<head>
  <title>Cut-Up Test</title>
</head>
<body>
  <h1>Simple Cut-Up Test</h1>
  <textarea id="input" style="width: 100%; height: 100px;">The cat sat on the mat. The dog ran in the park. The bird flew in the sky.</textarea>
  <br><br>
  <button onclick="testCutUp()">Test Word Scramble</button>
  <br><br>
  <pre id="output" style="border: 1px solid #ccc; padding: 10px; background: #f0f0f0;"></pre>

  <script>
    function tokenize(text, unit, segmentCount = 4) {
      if (!text || !text.trim()) {
        return [];
      }

      switch (unit) {
        case 'word':
          return text.split(/\s+/).filter(w => w.length > 0);

        case 'line':
          return text.split('\n');

        case 'sentence': {
          const sentences = [];
          let current = '';
          for (let i = 0; i < text.length; i++) {
            current += text[i];
            if ((text[i] === '.' || text[i] === '!' || text[i] === '?') &&
                (i === text.length - 1 || /\s/.test(text[i + 1]))) {
              sentences.push(current.trim());
              current = '';
            }
          }
          if (current.trim()) {
            sentences.push(current.trim());
          }
          return sentences.filter(s => s.length > 0);
        }

        case 'segment': {
          if (segmentCount < 2) return [text];
          const chunkSize = Math.ceil(text.length / segmentCount);
          const segments = [];
          for (let i = 0; i < text.length; i += chunkSize) {
            segments.push(text.slice(i, i + chunkSize));
          }
          return segments;
        }

        default:
          return [text];
      }
    }

    function shuffle(chunks) {
      const arr = [...chunks];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function join(chunks, unit) {
      if (chunks.length === 0) return '';

      switch (unit) {
        case 'word':
          return chunks.join(' ');
        case 'line':
          return chunks.join('\n');
        case 'sentence':
          return chunks.join(' ');
        case 'segment':
          return chunks.join('');
        default:
          return chunks.join('');
      }
    }

    function cutUp(text, method, options = {}) {
      const { segmentCount = 4 } = options;

      if (!text || !text.trim()) {
        return text;
      }

      let unit;
      switch (method) {
        case 'quadrant':
          unit = 'segment';
          break;
        case 'fold-in':
          unit = 'line';
          break;
        case 'line-shuffle':
          unit = 'line';
          break;
        case 'sentence-shuffle':
          unit = 'sentence';
          break;
        case 'word-scramble':
          unit = 'word';
          break;
        default:
          return text;
      }

      let chunks = unit === 'segment'
        ? tokenize(text, unit, segmentCount)
        : tokenize(text, unit);

      if (chunks.length < 2) {
        return text;
      }

      let result;
      switch (method) {
        case 'quadrant':
          result = shuffle(chunks);
          break;
        case 'fold-in': {
          if (chunks.length < 2) result = chunks;
          else {
            const mid = Math.floor(chunks.length / 2);
            const first = chunks.slice(0, mid);
            const second = chunks.slice(mid);
            result = [];
            const maxLen = Math.max(first.length, second.length);
            for (let i = 0; i < maxLen; i++) {
              if (i < first.length) result.push(first[i]);
              if (i < second.length) result.push(second[i]);
            }
          }
          break;
        }
        case 'line-shuffle':
        case 'sentence-shuffle':
        case 'word-scramble':
          result = shuffle(chunks);
          break;
        default:
          result = chunks;
      }

      return join(result, unit);
    }

    function testCutUp() {
      const text = document.getElementById('input').value;
      const output = document.getElementById('output');

      output.textContent = 'Testing word scramble...\n\n';
      output.textContent += 'Original:\n' + text + '\n\n';
      output.textContent += 'Result:\n' + cutUp(text, 'word-scramble');
    }
  </script>
</body>
</html>
